name: Publicar galería en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir y comprobar la galería
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Instalar dependencias
        run: npm ci

      - name: Construir la galería
        run: npm run build

      - name: Comprobar el catálogo y las imágenes
        run: npm test

      - name: Preparar Chromium para las pruebas
        run: npx playwright install --with-deps chromium

      - name: Comprobar la navegación y las preferencias
        run: npm run test:browser

      - name: Preparar los archivos para publicar
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar la galería
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
